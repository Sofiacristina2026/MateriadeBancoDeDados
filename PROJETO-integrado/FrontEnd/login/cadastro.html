
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SenaiHUB - Cadastro</title>

    <style>
        /* Configuração geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            min-height: 100vh;
            padding: 80px;
            background-color: #222;
        }

        /* Imagem de fundo atrás do cadastro */
        .imagem-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Caixa principal do cadastro */
        .caixa-cadastro {
            position: relative;
            z-index: 1;
            background-color: #e21a3b;
            color: white;
            width: 50%;
            max-width: 500px;
            padding: 80px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* Título */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Espaçamento entre os campos */
        .campo {
            margin-bottom: 18px;
        }

        /* Texto dos campos */
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        /* Campos de preenchimento */
        input {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        /* Destaque ao selecionar um campo */
        input:focus {
            box-shadow: 0 0 0 2px #ffb3bd;
        }

        /* Requisitos da senha */
        .requisitos {
            display: none;
            background-color: white;
            color: #333;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.8;
        }

        /* Mostra os requisitos ao selecionar a senha */
        .requisitos.visivel {
            display: block;
        }

        .requisitos li {
            list-style: none;
            color: #777;
        }

        /* Requisitos cumpridos */
        .requisitos li.cumprido {
            color: #16803c;
        }

        /* Mensagens de validação */
        #mensagem {
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        /* Organização dos botões */
        .botoes-acesso {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        /* Estilo dos botões */
        .botoes-acesso button,
        .botao-entrar {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        /* Botão Cadastrar */
        .botoes-acesso button {
            background-color: white;
            color: #c8102e;
            border: none;
        }

        .botoes-acesso button:hover {
            background-color: #eeeeee;
        }

        /* Botão Entrar */
        .botao-entrar {
            display: block;
            background-color: transparent;
            color: white;
            border: 2px solid white;
        }

        .botao-entrar:hover {
            background-color: #a50d25;
        }

        /* Adaptação para telas pequenas */
        @media (max-width: 480px) {
            .caixa-cadastro {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

  <img
    src="fotos/fotoPrincipal.png"
    alt="Imagem de fundo do SenaiHUB"
    class="imagem-fundo"
>

    <!-- Caixa principal do cadastro -->
    <section class="caixa-cadastro">

        <h1>Cadastro SenaiHUB</h1>

        <!-- Formulário de cadastro -->
        <form id="formCadastro">

            <!-- Nome completo -->
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <!-- Email -->
            <div class="campo">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <!-- Idade -->
            <div class="campo">
                <label for="idade">Idade:</label>
                <input
                    type="number"
                    id="idade"
                    name="idade"
                    min="18"
                    max="120"
                    placeholder="Digite sua idade"
                >
            </div>

            <!-- Telefone -->
            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                >
            </div>

            <!-- Senha -->
            <div class="campo">
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                    autocomplete="new-password"
                    aria-describedby="requisitos"
                >

                <!-- Requisitos da senha -->
                <div class="requisitos" id="requisitos">
                    <strong>A senha deve conter:</strong>

                    <ul>
                        <li id="regraTamanho">✗ Pelo menos 10 caracteres</li>
                        <li id="regraMaiuscula">✗ Uma letra maiúscula</li>
                        <li id="regraMinuscula">✗ Uma letra minúscula</li>
                        <li id="regraNumero">✗ Pelo menos um número</li>
                    </ul>
                </div>
            </div>

            <!-- Mensagem de validação -->
            <p id="mensagem" role="status" aria-live="polite"></p>

            <!-- Botões -->
            <div class="botoes-acesso">

                <button type="submit">
                    Cadastrar
                </button>

                <a href="LoginEntrar.html" class="botao-entrar">
                    Entrar
                </a>

            </div>
        </form>
    </section>

    <script>
        // Seleciona os elementos do formulário
        const formulario = document.getElementById("formCadastro");
        const senha = document.getElementById("senha");
        const requisitos = document.getElementById("requisitos");
        const mensagem = document.getElementById("mensagem");

        let senhaValida = false;

        // Mostra os requisitos ao selecionar o campo de senha
        senha.addEventListener("focus", function () {
            requisitos.classList.add("visivel");
        });

        // Verifica a senha enquanto a pessoa digita
        senha.addEventListener("input", function () {
            const valor = senha.value;

            const tamanhoValido = valor.length >= 10;
            const maiusculaValida = /[A-Z]/.test(valor);
            const minusculaValida = /[a-z]/.test(valor);
            const numeroValido = /[0-9]/.test(valor);

            atualizarRegra(
                "regraTamanho",
                tamanhoValido,
                "Pelo menos 10 caracteres"
            );

            atualizarRegra(
                "regraMaiuscula",
                maiusculaValida,
                "Uma letra maiúscula"
            );

            atualizarRegra(
                "regraMinuscula",
                minusculaValida,
                "Uma letra minúscula"
            );

            atualizarRegra(
                "regraNumero",
                numeroValido,
                "Pelo menos um número"
            );

            // Verifica se todos os requisitos foram cumpridos
            senhaValida =
                tamanhoValido &&
                maiusculaValida &&
                minusculaValida &&
                numeroValido;

            if (senhaValida) {
                mensagem.textContent = "Senha válida!";
                mensagem.style.color = "#ffffff";
            } else if (valor.length === 0) {
                mensagem.textContent =
                    "Digite uma senha para continuar.";
                mensagem.style.color = "#ffffff";
            } else {
                mensagem.textContent =
                    "Sua senha ainda não atende a todos os requisitos.";
                mensagem.style.color = "#ffffff";
            }
        });

        // Atualiza o texto de cada requisito
        function atualizarRegra(id, valido, descricao) {
            const item = document.getElementById(id);

            if (valido) {
                item.textContent = "✓ " + descricao;
                item.classList.add("cumprido");
            } else {
                item.textContent = "✗ " + descricao;
                item.classList.remove("cumprido");
            }
        }

        // Verifica o formulário ao clicar em Cadastrar
        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            if (senha.value.length === 0) {
                mensagem.textContent =
                    "Acesso negado: você precisa criar uma senha.";
                senha.focus();
                requisitos.classList.add("visivel");
                return;
            }

            if (!senhaValida) {
                mensagem.textContent =
                    "Cadastro bloqueado! Corrija os requisitos da senha.";
                senha.focus();
                requisitos.classList.add("visivel");
                return;
            }

            mensagem.textContent =
                "Senha válida! Os campos foram verificados.";

            alert(
                "Validação concluída! Para finalizar o cadastro, conecte o formulário ao PHP."
            );
        });
    </script>

</body>
</html>
