<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenaiHUB - Gerenciamento de Produtos (CRUD MongoDB)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* Topo da página */
        .navbar-gamer {
            background-color: #e21a3b;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-gamer h2 {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .navbar-gamer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .navbar-gamer a:hover {
            background: white;
            color: #e21a3b;
        }

        /* Conteúdo principal */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #e21a3b;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* Formulário */
        .grid-campos {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #444;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #e21a3b;
            box-shadow: 0 0 0 2px rgba(226, 26, 59, 0.2);
        }

        .botoes-form {
            display: flex;
            gap: 10px;
        }

        .btn-salvar {
            background-color: #e21a3b;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-salvar:hover {
            background-color: #ba132e;
        }

        .btn-cancelar {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background-color: #f1f3f5;
            color: #444;
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px 10px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        .badge-status {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .grid-campos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Superior -->
    <header class="navbar-gamer">
        <h2>SENAIHUB - CRUD MONGODB</h2>
        <a href="PaginaInicial.html">← Voltar para Início</a>
    </header>

    <main class="container">

        <!-- Card de Cadastro / Edição -->
        <section class="card">
            <h2>Cadastrar ou Editar Produto</h2>

            <form id="formProduto">
                <!-- Campo escondido para guardar o ID do produto ao editar -->
                <input type="hidden" id="produtoId">

                <div class="grid-campos">
                    <div class="campo">
                        <label for="produtoNome">Nome do Produto:</label>
                        <input type="text" id="produtoNome" placeholder="Ex: Notebook Gamer, Mouse..." required>
                    </div>

                    <div class="campo">
                        <label for="produtoPreco">Preço (R$):</label>
                        <input type="number" step="0.01" min="0" id="produtoPreco" placeholder="Ex: 199.90" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="produtoDescricao">Descrição ou Categoria:</label>
                    <textarea id="produtoDescricao" rows="2" placeholder="Ex: Periférico sem fio, 2.4GHz..."></textarea>
                </div>

                <div class="botoes-form">
                    <button type="submit" id="btnSalvarProduto" class="btn-salvar">
                        Cadastrar Produto
                    </button>
                    <button type="button" id="btnLimpar" class="btn-cancelar" onclick="limparFormulario()">
                        Limpar / Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Card da Lista de Produtos -->
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Produtos no MongoDB</h2>
                <button onclick="carregarTabelaProdutos()" style="background:#0284c7; color:white; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; font-weight:bold;">
                    ↻ Atualizar Lista
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Descrição</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutosCorpo">
                    <!-- Preenchido via script.js -->
                </tbody>
            </table>
        </section>

    </main>

    <script>
        function limparFormulario() {
            document.getElementById('formProduto').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('btnSalvarProduto').textContent = 'Cadastrar Produto';
        }
    </script>

    <!-- Conexão com a API do MongoDB -->
    <script src="script.js"></script>

</body>
</html>
